[project]
name = "essl_attendance"
authors = [
    { name = "Developer", email = "developer@example.com"}
]
description = "eSSL/ZKTeco Biometric Attendance Integration for ERPNext v16 / Frappe HRMS v16"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe~=16.0.0",
    "hrms~=16.0.0"
]

[project.optional-dependencies]
tcp = ["pyzk"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.app-dependencies]
frappe = ">=16.0.0"
hrms = ">=16.0.0"
